<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container d-flex flex-column justify-content-center align-items-center vh-100">
        <div class="header-controls w-100 d-flex justify-content-between mt-3">
            <div class="return">
                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
                </svg>
            </div>
            <div class="save">
                <button class="btn btn-danger">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-download" viewBox="0 0 16 16">
                        <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                        <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.5 0 1 0-.708.708z"/>
                    </svg>
                    Save
                </button>

            </div>
        </div>



        <div class="d-flex flex-column justify-content-center align-content-center gap-4 mt-3">
        <div class="audio-container is-active" data-mode="original">
            <div class="audio-file">
                <div class="head px-3 pt-3">
                    <div class="d-flex justify-content-between">
                        <h5 class="track-title mb-0">Id</h5>
                        <h5 class="track-type mb-0">Original</h5>
                    </div>
                    <small class="">Imported audio</small>
                </div>
                <div class="display px-3 py-3">
                    <div id="waveform">
                        <svg></svg>
                    </div>
                </div>
            </div>
        </div>

        <div class="audio-container" data-mode="processed">
            <div class="audio-file">
                <div class="head px-3 pt-3">
                    <div class="d-flex justify-content-between">
                        <h5 class="track-title mb-0">Id tech 8.wav</h5>
                        <h5 class="track-type mb-0">Processed</h5>
                    </div>
                    <small class="">Imported audio</small>
                </div>
                <div class="display px-3 py-3">
                    <div id="waveform">
                        <svg></svg>
                    </div>
                </div>
                <div class="foot d-flex align-items-center gap-2 px-3 pb-3 pt-3">
                    <div class="effect btn-control" data-effect="compressor">
                        Compressor
                    </div>
                    <div class="effect btn-control" data-effect="limiter">
                        Limiter
                    </div>
                    <div class="effect btn-control" data-effect="normalization">
                        Normalizer
                    </div>
                    <div class="effect btn-control" data-effect="distorsion">
                        Distorsion
                    </div>
                    <div class="effect volume btn-control ms-auto" >
                        <input type="range" name="gain">
                    </div>
                </div>
            </div>
        </div>
        </div>


        <div class="audio-player d-flex align-items-center justify-content-between px-3 py-2 mt-auto mb-4">
            <div class="time small">0:00 / 0:00</div>
            <div class="audio-selected-name small">Original</div>
            <div class="controls d-flex align-items-center gap-3">
                <div class="play btn-control">
                    <svg class="play-icon" xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" viewBox="0 0 16 16">
                      <path d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393"/>
                    </svg>
                    <svg class="pause-icon d-none" xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="currentColor" viewBox="0 0 16 16">
                      <path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5m5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- MODAL SECTION -->
        <div class="modal fade" id="deleteAudioModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content app-modal">
                    <div class="modal-header border-0">
                        <div class="modal-icon">
                            <i class="bi bi-exclamation-triangle"></i>
                        </div>
                        <h5 class="modal-title">Leave project?</h5>
                    </div>
                    <div class="modal-body">
                        <p class="modal-text">Going back will remove all the current processing and effects applied to this track.</p>
                        <p class="modal-subtext">This action cannot be undone.</p>
                    </div>
                
                    <div class="modal-footer border-0">
                        <button type="button" class="btn modal-cancel" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn modal-danger">Go back</button>
                    </div>
                </div>
            </div>       
        </div>

        <div class="modal fade" id="effectsModal" tabindex="-1" aria-labelledby="effectsModal" aria-hidden="true">
          <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
              <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel"></h1>
                <svg xmlns="http://www.w3.org/2000/svg" data-bs-dismiss="modal" aria-label="Close" width="30" height="30" fill="currentColor" class="bi bi-x" viewBox="0 0 16 16">
                    <path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708"/>
                </svg>
              </div>
              <div class="modal-body">
                
              </div>
            </div>
          </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>   
    <script src="db.js"></script>
    <script src="script.js" type="module"></script>
</body>
</html>
