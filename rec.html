<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="rec.css">
</head>
<body>
    <div class="container position-relative d-flex justify-content-center align-items-center vh-100">
        <div class="return position-absolute top-0 start-0 mt-3 ms-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
                <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
            </svg>
        </div>
        <div class="audio-container record-container" data-mode="record">
            <div class="audio-file">
                <div class="head px-3 pt-3">
                    <div class="d-flex justify-content-between">
                        <h5 class="track-title mb-0">Voice recording</h5>
                        <h5 class="track-type mb-0">Input</h5>
                    </div>
                    <small class="">Ready to record</small>
                </div>
                <div class="display px-3 py-3">
                    <div id="waveform">
                        <svg></svg>
                    </div>
                </div>
                <div class="record-controls px-3 pb-3 d-flex align-items-center gap-2">
                    <div class="input-select-wrapper">
                        <select class="audio-input-select">
                            <option selected disabled>
                                Select input
                            </option>
                        </select>
                    </div>
                    <button class="record-btn ms-auto">
                        <span class="record-dot"></span>
                        Record
                    </button>
                </div>
            </div>
        </div>

        <div class="modal fade" id="deleteRecModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content app-modal">
                    <div class="modal-header border-0">
                        <div class="modal-icon">
                            <i class="bi bi-exclamation-triangle"></i>
                        </div>
                        <h5 class="modal-title">Leave project?</h5>
                    </div>
                    <div class="modal-body">
                        <p class="modal-text">Going back will remove the current recording.</p>
                        <p class="modal-subtext">This action cannot be undone.</p>
                    </div>
                
                    <div class="modal-footer border-0">
                        <button type="button" class="btn modal-cancel" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" class="btn modal-danger">Go back</button>
                    </div>
                </div>
            </div>       
        </div>
    </div>

    <!--<script src="https://unpkg.com/wavesurfer.js@7"></script>-->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>   
    <script src="db.js"></script>
    <script src="record.js"></script>
</body>
</html>
